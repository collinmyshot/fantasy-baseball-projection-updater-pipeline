name: "RETIRED - Google Sheets Refresh (manual only)"

# RETIRED 2026-08-15. This no longer runs on a schedule.
#
# The schedule was three crons covering Dec 24 - Apr 15, dormant the rest of
# the year. It was removed rather than left in place because this repo is
# deprecated (see DEPRECATED.md) and a cron sitting quietly in a retired repo
# would have woken up on Dec 24 and started pushing commits again months after
# anyone stopped watching it.
#
# The crons are deleted; workflow_dispatch is kept so the pipeline can still be
# run by hand if the Sheets workflow is ever revived.
#
# BEFORE RUNNING THIS MANUALLY: it WRITES to the live Google Sheet. The
# position tabs and "RBLL Team & Targets" carry hand-entered columns
# (CK.Rank, DS.Rank, manual targets). The sync scripts are written to preserve
# them, but they have not been exercised since retirement, and the projections
# it would push may be from a stale season. Check config/pipeline.yml and the
# sheet's current contents first.
#
# Retiring this was the last thing keeping the monorepo operationally live.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fangraphs-refresh
  cancel-in-progress: false

jobs:
  refresh_sheets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R deps
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::yaml
            any::googlesheets4

      - name: Write Google service account key
        env:
          GSHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GSHEETS_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GSHEETS_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing required secret: GSHEETS_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/gsheets-service-account.json"
          printf '%s' "$GSHEETS_SERVICE_ACCOUNT_JSON" > "$KEY_FILE"
          echo "GSHEETS_SERVICE_ACCOUNT_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Run full pipeline
        run: Rscript scripts/run_pipeline.R --config config/pipeline.yml

      - name: Commit refreshed data
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: refresh fangraphs projections"
          git push
